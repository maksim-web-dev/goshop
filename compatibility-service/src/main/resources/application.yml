server:
  port: ${COMPATIBILITY_SERVER_PORT:8082}
  servlet:
    context-path: ${COMPATIBILITY_API_PREFIX:/api}
  shutdown: graceful

spring:
  application:
    name: compatibility-service
  jackson:
    serialization:
      write-dates-as-timestamps: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

app:
  seed:
    mode: ${COMPATIBILITY_SEED_MODE:init}
    stop-count: ${COMPATIBILITY_SEED_STOP_COUNT:1}
    enable: ${COMPATIBILITY_SEED_ENABLE:false}
  datasource:
    postgres:
      host: ${COMPATIBILITY_POSTGRES_HOST:localhost}
      port: ${COMPATIBILITY_POSTGRES_PORT:5432}
      db: ${COMPATIBILITY_POSTGRES_DB}
      user: ${COMPATIBILITY_POSTGRES_USER}
      pass: ${COMPATIBILITY_POSTGRES_PASSWORD}
      ssl: disable
      pool-max: ${COMPATIBILITY_HIKARI_POOL_MAX:25}
      pool-min: ${COMPATIBILITY_HIKARI_POOL_MIN:2}
      pool-timeout-millis: ${COMPATIBILITY_HIKARI_POOL_TIMEOUT_MILLIS:30000}
      show-sql: ${COMPATIBILITY_POSTGRES_SHOW_SQL:true}
      ddl-auto: ${COMPATIBILITY_POSTGRES_DDL_AUTO:update}
