openapi: "3.0.3"
info:
  title: Store Service
  version: "1.0.0"
servers:
  - url: /api

paths:
  /stores:
    get:
      summary: Get all stores
      responses:
        '200':
          description: List of stores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoreResponse'
    post:
      summary: Create a store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreCreateRequest'
      responses:
        '201':
          description: Store created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreResponse'
        '400':
          description: Invalid request body (blank fields, wrong code lengths)
        '409':
          description: Domain already registered

  /stores/{id}:
    get:
      summary: Get store by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Store found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreResponse'
        '404':
          description: Store not found
    patch:
      summary: Update a store
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreUpdateRequest'
      responses:
        '200':
          description: Store updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreResponse'
        '400':
          description: Invalid request body (wrong code lengths)
        '404':
          description: Store not found
    delete:
      summary: Deactivate a store
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Store deactivated
        '404':
          description: Store not found

  /stores/{storeId}/api-keys:
    post:
      summary: Create an API key for a store
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreApiKeyCreateRequest'
      responses:
        '201':
          description: API key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreApiKeyCreateResponse'
        '404':
          description: Store not found

  /stores/{storeId}/api-keys/{keyId}/revoke:
    post:
      summary: Revoke an API key
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: keyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: API key revoked
        '403':
          description: Key belongs to a different store
        '404':
          description: Key not found

  /stores/{storeId}/settings:
    get:
      summary: Get settings for a store
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Store settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreSettingsResponse'
        '404':
          description: Store not found
    put:
      summary: Update settings for a store
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreSettingsUpdateRequest'
      responses:
        '200':
          description: Store settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreSettingsResponse'
        '400':
          description: Invalid request body (non-positive rate limits)
        '404':
          description: Store not found

  /stores/{storeId}/webhooks:
    post:
      summary: Create a webhook for a store
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreWebhookCreateRequest'
      responses:
        '201':
          description: Webhook created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreWebhookResponse'
        '400':
          description: Invalid request body (blank url/secretRef, empty eventTypes)
        '404':
          description: Store not found

components:
  schemas:
    StoreStatus:
      type: string
      enum: [ACTIVE, INACTIVE, SUSPENDED]

    ApiKeyStatus:
      type: string
      enum: [ACTIVE, REVOKED, EXPIRED]

    StoreCreateRequest:
      type: object
      required: [name, domain, countryCode, defaultLanguage, defaultCurrency]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        domain:
          type: string
          minLength: 1
          maxLength: 255
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2, e.g. "US"
        defaultLanguage:
          type: string
          minLength: 2
          maxLength: 10
          description: BCP 47, e.g. "en"
        defaultCurrency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217, e.g. "USD"

    StoreUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          nullable: true
        defaultLanguage:
          type: string
          minLength: 2
          maxLength: 10
          nullable: true
        defaultCurrency:
          type: string
          minLength: 3
          maxLength: 3
          nullable: true
        status:
          $ref: '#/components/schemas/StoreStatus'

    StoreResponse:
      type: object
      required: [id, name, domain, countryCode, defaultLanguage, defaultCurrency, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        domain:
          type: string
        countryCode:
          type: string
        defaultLanguage:
          type: string
        defaultCurrency:
          type: string
        status:
          $ref: '#/components/schemas/StoreStatus'
        createdAt:
          type: string
          format: date-time

    StoreApiKeyCreateRequest:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
          nullable: true

    StoreApiKeyCreateResponse:
      type: object
      required: [id, keyPrefix, plainKey, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
        keyPrefix:
          type: string
        plainKey:
          type: string
        status:
          $ref: '#/components/schemas/ApiKeyStatus'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true

    StoreSettingsUpdateRequest:
      type: object
      properties:
        requestsPerSecond:
          type: integer
          minimum: 1
          nullable: true
        burstLimit:
          type: integer
          minimum: 1
          nullable: true
        allowedLanguages:
          type: array
          items:
            type: string
          nullable: true

    StoreSettingsResponse:
      type: object
      required: [id, storeId, requestsPerSecond, burstLimit, allowedLanguages]
      properties:
        id:
          type: integer
          format: int64
        storeId:
          type: integer
          format: int64
        requestsPerSecond:
          type: integer
        burstLimit:
          type: integer
        allowedLanguages:
          type: array
          items:
            type: string

    StoreWebhookCreateRequest:
      type: object
      required: [url, eventTypes, secretRef]
      properties:
        url:
          type: string
          minLength: 1
        eventTypes:
          type: array
          items:
            type: string
          minItems: 1
        secretRef:
          type: string
          minLength: 1
        enabled:
          type: boolean
          default: true

    StoreWebhookResponse:
      type: object
      required: [id, storeId, url, eventTypes, secretRef, enabled]
      properties:
        id:
          type: integer
          format: int64
        storeId:
          type: integer
          format: int64
        url:
          type: string
        eventTypes:
          type: array
          items:
            type: string
        secretRef:
          type: string
        enabled:
          type: boolean
