server:
  port: ${SEARCH_SERVER_PORT:8086}
  servlet:
    context-path: ${SEARCH_API_PREFIX:/api}

spring:
  application:
    name: search-service
  jackson:
    serialization:
      write-dates-as-timestamps: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  seed:
    mode: ${SEARCH_SEED_MODE:init}
    stop-count: ${SEARCH_SEED_STOP_COUNT:1}
    enable: ${SEARCH_SEED_ENABLE:false}
  datasource:
    postgres:
      host: ${SEARCH_POSTGRES_HOST:localhost}
      port: ${SEARCH_POSTGRES_PORT:5432}
      db: ${SEARCH_POSTGRES_DB}
      user: ${SEARCH_POSTGRES_USER}
      pass: ${SEARCH_POSTGRES_PASSWORD}
      ssl: disable
      pool-max: ${SEARCH_HIKARI_POOL_MAX:25}
      pool-min: ${SEARCH_HIKARI_POOL_MIN:2}
      pool-timeout-millis: ${SEARCH_HIKARI_POOL_TIMEOUT_MILLIS:30000}
      show-sql: ${SEARCH_POSTGRES_SHOW_SQL:true}
      ddl-auto: ${SEARCH_POSTGRES_DDL_AUTO:update}
