server:
  port: ${LOCALIZATION_SERVER_PORT:8083}
  servlet:
    context-path: ${LOCALIZATION_API_PREFIX:/api}
  shutdown: graceful

spring:
  application:
    name: localization-service
  jackson:
    serialization:
      write-dates-as-timestamps: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

app:
  seed:
    mode: ${LOCALIZATION_SEED_MODE:init}
    stop-count: ${LOCALIZATION_SEED_STOP_COUNT:1}
    enable: ${LOCALIZATION_SEED_ENABLE:false}
  datasource:
    postgres:
      host: ${LOCALIZATION_POSTGRES_HOST:localhost}
      port: ${LOCALIZATION_POSTGRES_PORT:5432}
      db: ${LOCALIZATION_POSTGRES_DB}
      user: ${LOCALIZATION_POSTGRES_USER}
      pass: ${LOCALIZATION_POSTGRES_PASSWORD}
      ssl: disable
      pool-max: ${LOCALIZATION_HIKARI_POOL_MAX:25}
      pool-min: ${LOCALIZATION_HIKARI_POOL_MIN:2}
      pool-timeout-millis: ${LOCALIZATION_HIKARI_POOL_TIMEOUT_MILLIS:30000}
      show-sql: ${LOCALIZATION_POSTGRES_SHOW_SQL:true}
      ddl-auto: ${LOCALIZATION_POSTGRES_DDL_AUTO:update}
