server:
  port: ${PRODUCT_SERVER_PORT:8080}
  servlet:
    context-path: ${PRODUCT_API_PREFIX:/api}

spring:
  application:
    name: product-service
  jackson:
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  seed:
    mode: ${PRODUCT_SEED_MODE:init}
    stop-count: ${PRODUCT_SEED_STOP_COUNT:1}
    enable: ${PRODUCT_SEED_ENABLE:false}
  datasource:
    postgres:
      host: ${PRODUCT_POSTGRES_HOST:localhost}
      port: ${PRODUCT_POSTGRES_PORT:5432}
      db: ${PRODUCT_POSTGRES_DB}
      user: ${PRODUCT_POSTGRES_USER}
      pass: ${PRODUCT_POSTGRES_PASSWORD}
      ssl: disable
      pool-max: ${PRODUCT_HIKARI_POOL_MAX:25}
      pool-min: ${PRODUCT_HIKARI_POOL_MIN:2}
      pool-timeout-millis: ${PRODUCT_HIKARI_POOL_TIMEOUT_MILLIS:30000}
      show-sql: ${PRODUCT_POSTGRES_SHOW_SQL:true}
      ddl-auto: ${PRODUCT_POSTGRES_DDL_AUTO:update}