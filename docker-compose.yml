      postgres-localization:
        condition: service_healthy
    networks:
      - goshop-network

  postgres-localization:
    image: postgres:16-alpine
    container_name: postgres-localization
    environment:
      POSTGRES_DB: localization_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
