services:

  # ── Infrastructure ─────────────────────────────────────────────────────────

  postgres-product:
    image: postgres:16-alpine
    container_name: postgres-product
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-product-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d product_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - goshop-network

  # ── Services ───────────────────────────────────────────────────────────────

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: product-service
    ports:
      - "8081:8080"
    environment:
      DB_HOST: postgres-product
      DB_PORT: 5432
      DB_NAME: product_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres-product:
        condition: service_healthy
    networks:
      - goshop-network

  store-service:
    build:
      context: .
      dockerfile: store-service/Dockerfile
    container_name: store-service
    ports:
      - "8082:8080"
    environment:
      DB_HOST: postgres-store
      DB_PORT: 5432
      DB_NAME: store_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres-store:
        condition: service_healthy
    networks:
      - goshop-network

  postgres-store:
    image: postgres:16-alpine
    container_name: postgres-store
    environment:
      POSTGRES_DB: store_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-store-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d store_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - goshop-network

  pricing-service:
