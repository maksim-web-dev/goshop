    ports:
      - "8083:8080"
    environment:
      DB_HOST: postgres-pricing
      DB_PORT: 5432
      DB_NAME: pricing_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres-pricing:
        condition: service_healthy
    networks:
      - goshop-network

  postgres-pricing:
    image: postgres:16-alpine
    container_name: postgres-pricing
    environment:
      POSTGRES_DB: pricing_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-pricing-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pricing_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - goshop-network

  localization-service:
    build:
      context: .
      dockerfile: localization-service/Dockerfile
    container_name: localization-service
    ports:
      - "8084:8080"
    environment:
      DB_HOST: postgres-localization
      DB_PORT: 5432
      DB_NAME: localization_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
